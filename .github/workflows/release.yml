name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release tags on master
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic quality gate
        run: npm run verify
      - name: Build release package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            npm run package:release -- --tag "$RELEASE_TAG"
          else
            npm run package:release
          fi
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-sync-${{ github.sha }}
          path: |
            .artifacts/release/mqtt-sync-*.zip
            .artifacts/release/mqtt-sync-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            .artifacts/release/mqtt-sync-*.zip \
            .artifacts/release/mqtt-sync-*.zip.sha256 \
            main.js manifest.json styles.css \
            --verify-tag \
            --title "MQTT Sync $GITHUB_REF_NAME" \
            --generate-notes
